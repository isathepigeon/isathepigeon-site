  <h3 class="main-title"><a  href="https://isamgomexx.neocities.org/"> A certain specific Isa</a></h3>
  
  <audio controls autoplay loop>
  <source src="/metro_rio.mp3" type="audio/mpeg">
  Your browser does not support audio.
</audio>

  <div id="posts">

<script>

fetch('/posts.json')
  .then(res => res.json())
  .then(posts => {
    const container = document.getElementById('posts');

    posts.forEach(post => {
      const div = document.createElement('div');
      div.className = 'post';

      div.innerHTML = `
        <h4>${post.title}</h4>
        <p>${post.content}</p>
      `;

      container.appendChild(div);

      div.querySelectorAll('a').forEach(link => {  
 link.addEventListener('click', function() {  
 posthog.capture('post_link_clicked', {  
 href: link.href,  
 text: link.innerText,  
 post_title: post.title  
 });  
 });  
 });   
    });
  })
  .catch(err => {
    console.error(err);
    document.getElementById('posts').innerText = "Posts failed to load.";
  });
</script>
</div>
